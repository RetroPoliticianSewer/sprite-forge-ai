[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-forge-ai"
version = "0.4.2"
description = "Local AI sprite, tileset, and animation-frame generator for 2D game devs."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
authors = [{ name = "sprite-forge-ai contributors" }]
license = { text = "MIT" }
dependencies = [
    "PySide6==6.7.2",
    "torch==2.4.1",
    "diffusers==0.30.2",
    "transformers==4.44.2",
    "accelerate==0.33.0",
    "safetensors==0.4.5",
    "Pillow==10.4.0",
    "numpy==1.26.4",
    "pydantic==2.8.2",
    "tomli==2.0.1",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "pytest-cov==5.0.0", "ruff==0.6.2", "mypy==1.11.1"]

[project.scripts]
spriteforge = "spriteforge.app:main"

[tool.setuptools.packages.find]
include = ["spriteforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true